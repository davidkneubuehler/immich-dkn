name: Downstream server release

on:
  push:
    tags:
      - 'dkn-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validation:
    name: Validate downstream changes
    permissions:
      contents: read
    uses: ./.github/workflows/dkn-stack-selection.yml

  publish:
    name: Build and publish immich-server
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Validate downstream tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^dkn-(v[0-9]+\.[0-9]+\.[0-9]+)([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid downstream tag: $TAG" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
        id: version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve official upstream image
        id: upstream
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          reference="ghcr.io/immich-app/immich-server:$UPSTREAM_VERSION"
          if ! digest=$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -re .digest) \
            || [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Upstream baseline::Could not resolve the digest of $reference."
            exit 1
          fi
          {
            echo "image=$reference@$digest"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Upstream baseline image: $reference"
            echo "Upstream baseline digest: $digest"
          } | tee immich-upstream.image >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-server
          tags: type=raw,value=${{ steps.version.outputs.version }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push immich-server
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_IMAGE=ghcr.io/${{ github.repository_owner }}/immich-server:${{ steps.version.outputs.version }}
            BUILD_IMAGE_URL=${{ github.server_url }}/${{ github.repository }}/pkgs/container/immich-server
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
            BUILD_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/immich-server@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: immich-server-sbom.cdx.json
          version: v0.69.3

      - name: Scan downstream image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/immich-server@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-downstream.json
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.69.3

      - name: Scan upstream baseline image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.upstream.outputs.image }}
          format: json
          output: trivy-upstream.json
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.69.3

      - name: Record image digest and new findings
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM_IMAGE: ${{ steps.upstream.outputs.image }}
        run: |
          echo "$DIGEST" > immich-server.digest
          findings() {
            jq -r '.Results[]? | .Type as $type | .Vulnerabilities[]? | "\($type)|\(.PkgName)|\(.InstalledVersion)|\(.VulnerabilityID)|\(.Severity)"' "$1" | sort -u
          }
          findings trivy-downstream.json > trivy-downstream.txt
          findings trivy-upstream.json > trivy-upstream.txt
          comm -23 trivy-downstream.txt trivy-upstream.txt > trivy-new-findings.txt
          {
            echo "Upstream baseline: $UPSTREAM_IMAGE"
            echo "Downstream fixable HIGH/CRITICAL findings: $(wc -l < trivy-downstream.txt)"
            echo "Upstream fixable HIGH/CRITICAL findings: $(wc -l < trivy-upstream.txt)"
            echo "Findings not present upstream: $(wc -l < trivy-new-findings.txt)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-server-${{ steps.version.outputs.version }}
          path: |
            immich-server.digest
            immich-upstream.image
            immich-server-sbom.cdx.json
            trivy-downstream.json
            trivy-upstream.json
            trivy-new-findings.txt

      - name: Fail on vulnerabilities not present upstream
        run: |
          if [ -s trivy-new-findings.txt ]; then
            echo "Downstream image adds fixable HIGH/CRITICAL findings:" >&2
            cat trivy-new-findings.txt >&2
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign image by keyless identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/immich-server
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/immich-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
